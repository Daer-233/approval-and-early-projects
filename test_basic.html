<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础测试</title>
<style>
body{background:#121212;color:#e0e0e0;font-family:sans-serif;padding:20px}
.log{background:#1e1e1e;padding:12px;border-radius:8px;margin:10px 0;font-family:monospace;font-size:13px}
.ok{color:#22c55e}.err{color:#ef4444}.warn{color:#f59e0b}
button{padding:8px 16px;margin:4px;border:1px solid #444;border-radius:6px;background:#2a2a2a;color:#e0e0e0;cursor:pointer}
button:hover{background:#444}
.container{border:1px solid #444;border-radius:8px;padding:12px;margin:10px 0;min-height:40px}
.msg{padding:8px 12px;margin:4px 0;border-radius:8px;font-size:14px}
.msg.user{background:#6366F1;color:#fff;text-align:right}
.msg.ai{background:#2a2a2a;border:1px solid #333}
</style>
</head>
<body>
<h2>基础 DOM 测试</h2>

<p>容器 (id=testContainer):</p>
<div class="container" id="testContainer"></div>

<p>
  <button onclick="addMsg('user','你好')">加用户消息</button>
  <button onclick="addMsg('ai','你好，我是AI')">加 AI 消息</button>
  <button onclick="addMsg('user','第二条用户消息')">再加用户消息</button>
  <button onclick="addMsg('ai','这是第二条AI回复')">再加 AI 消息</button>
  <button onclick="clearAll()">清空</button>
</p>

<div id="logs"></div>

<script>
var container = document.getElementById('testContainer');
var logsDiv = document.getElementById('logs');

function log(msg, cls) {
  var d = document.createElement('div');
  d.className = 'log ' + (cls||'');
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  logsDiv.appendChild(d);
  console.log(msg);
}

function addMsg(role, text) {
  log('addMsg(' + role + ', "' + text + '") - before: ' + container.children.length + ' children');

  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  container.appendChild(div);

  log('addMsg done - after: ' + container.children.length + ' children, last child: "' + container.lastChild.textContent + '"', 'ok');
}

function clearAll() {
  log('clearAll - was: ' + container.children.length + ' children');
  container.innerHTML = '';
  log('clearAll done - now: ' + container.children.length + ' children', 'warn');
}

// Initial log
log('页面加载完成, chatContainer 引用有效: ' + (container !== null), 'ok');
log('container.tagName = ' + container.tagName, 'ok');
</script>
</body>
</html>
