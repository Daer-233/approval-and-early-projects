services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - allowance_data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  allowance_data:
